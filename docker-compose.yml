x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://webhooks:webhooks@postgres:5432/webhooks
  # Dev-only key. In any real deployment this comes from a secret store.
  # Comma-separate several keys to rotate: the first encrypts, all can decrypt.
  SECRET_ENCRYPTION_KEY: 53e3t6jx9F6UErqnZ3HYdnEJjPMKZ2wiQ-Wwmt1nBQM=

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "webhooks"]
      interval: 2s
      retries: 15

  # One-shot: runs migrations once, then exits. The API never migrates on boot,
  # so scaling it out can't race two migrations against each other.
  migrate:
    build: .
    environment: *app-env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
