x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://webhooks:webhooks@postgres:5432/webhooks
  # Read from .env (git-ignored), never committed. Create it with the command in
  # .env.example. Comma-separate several keys to rotate: the first encrypts, all decrypt.
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?missing - create .env as described in .env.example}
  # Dev-only: lets the SSRF guard allow the demo receiver, which has a private IP.
  # Never set this in production.
  SSRF_ALLOW_HOSTS: receiver

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "webhooks"]
      interval: 2s
      retries: 15

  # One-shot: runs migrations once, then exits. The API never migrates on boot,
  # so scaling it out can't race two migrations against each other.
  migrate:
    build: .
    environment: *app-env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    environment: *app-env
    command: python -m webhooks.worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Demo destination: register http://receiver/hook as an endpoint and watch its logs.
  # Make it fail to see retries:  RECEIVER_STATUS=500 docker compose up -d receiver
  # Check signatures:  RECEIVER_SECRET=whsec_... docker compose up -d receiver
  receiver:
    build: .
    command: python -m webhooks.receiver --status ${RECEIVER_STATUS:-200} --secret "${RECEIVER_SECRET:-}"
